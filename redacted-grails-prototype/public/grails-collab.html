<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAILS — Collaborative Beat Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg-p:#0d0d14;--bg-l:#100d0e;--bg-s:#111118;--bg-h:#16161f;
  --b:#1e1e2e;--bm:#252535;
  --c:#00d9ff;--cd:#00b8d9;--cg:rgba(0,217,255,0.12);--cgs:rgba(0,217,255,0.25);
  --am:#ffb347;
  --tp:#e8e8f0;--ts:#7878a0;--tm:#4a4a6a;--td:#2a2a42;
  --gr:#00ff88;--r:#ff4466;
  --cs:#8b5cf6;
}
html,body{height:100%;background:var(--bg);color:var(--tp);font-family:'IBM Plex Mono',monospace;overflow:hidden;margin:0}
body{display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:flex-end;padding:0 16px;height:40px;border-bottom:1px solid var(--b);background:var(--bg-p);flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:16px}
.hdr-ttl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.hdr-ttl span{color:var(--c)}
.dvdr{width:1px;height:20px;background:var(--bm)}
.stat{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--tm)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--gr)}50%{opacity:.4;box-shadow:0 0 3px var(--gr)}}
.hdr-r{display:flex;gap:8px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:3px;border:1px solid var(--bm);background:transparent;color:var(--ts);cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--cd);color:var(--c);background:var(--cg)}
.btn-p{border-color:var(--cd);color:var(--c);background:var(--cg)}
.btn-p:hover{background:var(--cgs)}
.btn-clr{border-color:var(--td);color:var(--tm);font-size:9px;opacity:.6}
.btn-clr:hover{border-color:var(--r);color:var(--r);background:rgba(255,68,102,.06);opacity:1}
.bnav{display:flex;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid var(--b);background:var(--bg-p);flex-shrink:0}
.narr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ts);background:transparent;border:1px solid var(--bm);border-radius:3px;padding:5px 12px;cursor:pointer;transition:all .15s}
.narr:hover{border-color:var(--cd);color:var(--c);background:var(--cg)}
.narr:disabled{opacity:.2;cursor:not-allowed}
.sw{flex:1;position:relative}
.bsel{width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tp);background:var(--bg-s);border:1px solid var(--bm);border-radius:3px;padding:7px 30px 7px 12px;cursor:pointer;appearance:none}
.bsel:focus{outline:none;border-color:var(--cd)}
.sw::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--tm);pointer-events:none}
.bctr{font-size:10px;color:var(--tm);white-space:nowrap;min-width:46px;text-align:right}
.prog{height:2px;background:var(--b);flex-shrink:0}
.pf{height:100%;background:linear-gradient(90deg,var(--c),var(--cd));transition:width .3s}
.ws{display:flex;flex:1;overflow:hidden;min-height:0}
.pl{width:38%;flex:none;display:flex;flex-direction:column;background:var(--bg-l);position:relative;overflow:hidden}
/* Resize handles */
.rh-v{width:5px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;z-index:10;transition:background .15s}
.rh-v::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1px;height:40px;background:var(--bm);border-radius:2px;transition:background .15s}
.rh-v:hover,.rh-v.dragging{background:rgba(0,217,255,0.06)}
.rh-v:hover::after,.rh-v.dragging::after{background:var(--c)}
.rh-h{height:5px;background:transparent;cursor:row-resize;flex-shrink:0;position:relative;z-index:10;transition:background .15s}
.rh-h::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:1px;background:var(--bm);border-radius:2px;transition:background .15s}
.rh-h:hover,.rh-h.dragging{background:rgba(0,217,255,0.06)}
.rh-h:hover::after,.rh-h.dragging::after{background:var(--c)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--b);flex-shrink:0}
.plbl{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase}
.lb{color:var(--am);opacity:.75}
.cct{font-size:9px;color:var(--td)}
.iw{flex:1;padding:14px 16px 10px;display:flex;flex-direction:column;overflow:hidden}
textarea.note{width:100%;flex:1;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.75;color:var(--tp);background:var(--bg-s);border:1px solid var(--bm);border-radius:4px;padding:13px;resize:none}
textarea.note::placeholder{color:var(--td);font-style:italic}
textarea.note:focus{outline:none;border-color:rgba(255,179,71,.35);box-shadow:0 0 0 2px rgba(255,179,71,.06)}
.sa{padding:10px 16px 14px;border-top:1px solid var(--b);flex-shrink:0}
.sbtn{width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:11px;border-radius:3px;border:1px solid var(--cd);background:var(--cg);color:var(--c);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.sbtn:hover{background:var(--cgs);box-shadow:0 0 16px var(--cg)}
.shint{font-size:9px;color:var(--td);text-align:center;margin-top:6px}
.asb{flex-shrink:0;overflow-y:auto;border-top:1px solid var(--b);padding:8px 16px 12px;display:none;flex-direction:column;gap:5px;min-height:0}
.ashdr{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--td);margin-bottom:4px}
.achip{background:rgba(0,217,255,.03);border:1px solid rgba(0,217,255,.1);border-radius:3px;padding:7px 28px 7px 10px;font-size:10px;line-height:1.55;color:var(--ts);position:relative}
.achip .cdel{position:absolute;top:6px;right:8px;font-size:11px;color:var(--td);cursor:pointer;background:none;border:none;font-family:inherit;transition:color .1s;line-height:1;padding:2px}
.achip .cdel:hover{color:var(--r)}
.pr{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.bscr{flex:1;overflow-y:auto;padding:26px 30px 50px}
.bc{width:100%}
.bsq{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--tm);margin-bottom:4px}
.bttl{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--tp);margin-bottom:4px;line-height:1.2}
.bttl .bn{color:var(--c);font-size:14px;font-weight:400;margin-right:8px;opacity:.6}
.ctag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#0a0a0f;border-radius:2px;padding:3px 10px;margin-bottom:22px;font-weight:700}
.ct-t{background:var(--cd)}
.ct-b{background:var(--am)}
.ct-d{background:var(--tm)}
.fld{margin-bottom:16px}
.fl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--c);opacity:.55;margin-bottom:4px}
.fv{font-size:12px;line-height:1.75;color:var(--ts)}
.fv.loc{color:var(--tp);font-size:11px;letter-spacing:.03em}
.sec{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--b)}
.sec:last-child{border-bottom:none;margin-bottom:0}
.slbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tm);margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:10px}
.slbl::after{content:'';flex:1;height:1px;background:var(--b)}
.sb{font-size:12px;line-height:1.8;color:var(--ts);white-space:pre-line}
.zi{display:flex;gap:12px;font-size:11px;margin-bottom:7px}
.zr{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--td);flex-shrink:0;width:90px;padding-top:1px}
.zv{color:var(--ts);line-height:1.6}
.sr{display:flex;gap:12px;margin-bottom:7px;font-size:11px}
.sk{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--td);flex-shrink:0;width:60px;padding-top:1px}
.sv{color:var(--ts);line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--bm);border-radius:2px;padding:3px 8px;color:var(--tm)}
.ab{margin:20px 0;border-left:2px solid var(--c);padding:13px 16px;background:rgba(0,217,255,.04);border-radius:0 4px 4px 0;animation:si .2s ease;position:relative}
@keyframes si{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.ahdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.albl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--c);font-weight:600}
.ats{font-size:9px;color:var(--td)}
.atxt{font-size:12px;line-height:1.75;color:var(--tp);white-space:pre-line}
.adel{position:absolute;top:10px;right:12px;font-size:11px;color:var(--td);cursor:pointer;background:none;border:none;font-family:inherit;padding:2px 5px;border-radius:2px;transition:all .1s}
.adel:hover{color:var(--r);background:rgba(255,68,102,.08)}
/* GOALS */
.goals-block{margin-bottom:22px;padding:14px 16px;background:rgba(139,92,246,0.06);border:1px solid rgba(139,92,246,0.18);border-radius:4px}
.goals-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.goals-title{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--cs);font-weight:600}
.goals-toggle{font-size:10px;color:rgba(139,92,246,0.4);transition:transform .2s;margin-left:8px}
.goals-toggle.open{transform:rotate(180deg)}
.goals-body{margin-top:13px;display:none}
.goals-body.open{display:block}
.goals-sect{margin-bottom:12px}
.goals-sect:last-child{margin-bottom:0}
.goals-sect-lbl{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(139,92,246,0.35);margin-bottom:6px}
.goals-draft{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(139,92,246,0.25);margin-left:8px}
.goals-row{display:flex;gap:10px;margin-bottom:5px;font-size:11px}
.goals-role{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:rgba(139,92,246,0.4);flex-shrink:0;width:88px;padding-top:1px}
.goals-val{color:#9980c8;line-height:1.55}
.goals-edit-field{
  color:#9980c8;
  line-height:1.55;
  cursor:pointer;
  border-radius:2px;
  padding:2px 4px;
  margin:-2px -4px;
  transition:background .15s;
  min-width:60px;
  display:inline-block;
}
.goals-edit-field:hover{background:rgba(139,92,246,0.1);}
.goals-edit-field:focus{
  outline:none;
  background:rgba(139,92,246,0.15);
  color:#c4b0e8;
}
.goals-edit-field[data-empty="true"]{
  color:rgba(139,92,246,0.25);
  font-style:italic;
}
.goals-sub-label{
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:rgba(139,92,246,0.65);
  margin-bottom:3px;
}
.goals-role-block{
  margin-bottom:14px;
}
.goals-role-name{
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(139,92,246,0.85);
  font-weight:700;
  margin-bottom:6px;
}
/* BEAT EDITABLE FIELDS */
.beat-edit{
  display:block;
  border-radius:3px;
  padding:3px 5px;
  margin:-3px -5px;
  cursor:text;
  transition:background .15s, outline .15s;
  white-space:pre-wrap;
  outline:none;
}
.beat-edit:hover{background:rgba(0,217,255,0.05);}
.beat-edit.editing{background:rgba(0,217,255,0.08);outline:1px solid rgba(0,217,255,0.25);}
.beat-reset{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--td);background:none;border:none;cursor:pointer;padding:0;font-family:inherit;float:right;margin-top:2px;}
.beat-reset:hover{color:var(--r);}
.commit-bar{display:flex;align-items:center;gap:10px;padding:12px 0 0;margin-top:8px;border-top:1px solid var(--b);}
.commit-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:3px;border:1px solid var(--cd);background:var(--cg);color:var(--c);cursor:pointer;transition:all .15s;}
.commit-btn:hover{background:var(--cgs);box-shadow:0 0 12px var(--cg);}
.commit-btn:disabled{opacity:.4;cursor:not-allowed;}
.commit-status{font-size:10px;color:var(--ts);}
/* COMING SOON */
.cs-wrap{padding:40px 20px;text-align:center;opacity:.6}
.cs-fwname{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tm);margin-bottom:10px}
.cs-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:var(--tm);margin-bottom:14px}
.cs-badge{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--bm);border-radius:2px;padding:4px 12px;color:var(--td)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bm);border-radius:3px}
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mov.open{display:flex}
.modal{background:var(--bg-p);border:1px solid var(--bm);border-radius:6px;width:640px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--b)}
.mttl{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.mclose{font-size:15px;color:var(--tm);cursor:pointer;background:none;border:none;font-family:inherit;padding:3px 7px;border-radius:2px;transition:all .1s}
.mclose:hover{color:var(--tp);background:var(--bg-h)}
.mbody{flex:1;overflow-y:auto;padding:18px 20px}
.mta{width:100%;height:420px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;color:var(--ts);background:var(--bg-s);border:1px solid var(--bm);border-radius:4px;padding:14px;resize:none}
.mftr{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--b);justify-content:flex-end}
/* EDIT BEAT MODAL */
.edit-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.edit-modal-overlay.open{display:flex}
.edit-modal{background:var(--bg-p);border:1px solid var(--bm);border-radius:6px;width:680px;max-width:94vw;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.edit-modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--b)}
.edit-modal-ttl{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.edit-modal-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.edit-field-group{display:flex;flex-direction:column;gap:4px}
.edit-field-lbl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--c);opacity:.55}
.edit-field-input{width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;color:var(--ts);background:var(--bg-s);border:1px solid var(--bm);border-radius:3px;padding:10px 12px;resize:vertical}
.edit-field-input:focus{outline:none;border-color:var(--cd)}
.edit-modal-ftr{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--b);justify-content:flex-end;align-items:center}
.edit-save-status{font-size:10px;color:var(--ts);flex:1}
.edit-btn-cancel{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:3px;border:1px solid var(--bm);background:transparent;color:var(--ts);cursor:pointer;transition:all .15s}
.edit-btn-cancel:hover{border-color:var(--r);color:var(--r)}
.edit-btn-save{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 18px;border-radius:3px;border:1px solid var(--cd);background:var(--cg);color:var(--c);cursor:pointer;transition:all .15s}
.edit-btn-save:hover{background:var(--cgs)}
.edit-btn-save:disabled{opacity:.4;cursor:not-allowed}
.edit-beat-link{display:inline-flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 0;transition:color .15s;margin-bottom:2px}
.edit-beat-link:hover{color:var(--c)}
</style>
</head>
<body>

<div class="bnav">
  <button class="narr" id="btn-prev" onclick="go(-1)">&larr; prev</button>
  <div class="sw">
    <select class="bsel" id="bsel" onchange="onSelChange(this.value)"></select>
  </div>
  <span class="bctr" id="bctr">— / —</span>
  <button class="narr" id="btn-next" onclick="go(1)">next &rarr;</button>
  <div class="dvdr"></div>
  <button class="btn btn-clr" onclick="clearAll()">Clear</button>
  <button class="btn btn-clr" id="see-notes-btn" onclick="toggleNotesModal()" style="display:none">△ Notes</button>
  <button class="btn btn-p" id="commit-nav-btn" onclick="commitBeatEdits()">↑ Commit</button>
</div>
<div class="prog"><div class="pf" id="pf" style="width:2.7%"></div></div>

<div class="ws">
  <div class="pl">
    <div class="ph">
      <span class="plbl lb">B: Your Notes</span>
      <span class="cct" id="cct">0 chars</span>
    </div>
    <div class="iw">
      <textarea class="note" id="ni" oninput="updateCct()"
        placeholder="Type your notes, ideas, fragments, questions about this beat...&#10;&#10;What's working? What's missing? What needs sharpening?&#10;&#10;Coywolf will annotate inline &rarr;"></textarea>
    </div>
    <div class="sa">
      <button class="sbtn" id="send-btn" onclick="sendNote()"><span>Send to Coywolf</span><span>&rarr;</span></button>
    </div>
    <div class="rh-h" id="rh-h" style="display:none"></div>
    <div class="asb" id="asb" style="display:none!important">
      <div class="ashdr" id="ashdr">Notes on this beat</div>
      <div id="achips"></div>
    </div>
  </div>
  <div class="rh-v" id="rh-v"></div>
  <div class="pr" id="pr">
    <div class="bscr" id="bscr">
      <div class="bc" id="bc"></div>
    </div>
  </div>
</div>

<div class="mov" id="mov" onclick="closeExBg(event)">
  <div class="modal">
    <div class="mhdr">
      <span class="mttl">Export Beat Sheet</span>
      <button class="mclose" onclick="closeEx()">&times;</button>
    </div>
    <div class="mbody"><textarea class="mta" id="mta" readonly></textarea></div>
    <div class="mftr">
      <button class="btn" onclick="closeEx()">Close</button>
      <button class="btn btn-p" onclick="copyEx()">Copy to clipboard</button>
    </div>
  </div>
</div>

<!-- Edit Beat Modal -->
<div class="edit-modal-overlay" id="edit-modal-overlay" onclick="closeEditBeatBg(event)">
  <div class="edit-modal" id="edit-modal">
    <div class="edit-modal-hdr">
      <span class="edit-modal-ttl" id="edit-modal-ttl">Edit Beat</span>
      <button class="mclose" onclick="closeEditBeat()">&times;</button>
    </div>
    <div class="edit-modal-body" id="edit-modal-body">
      <div class="edit-field-group">
        <label class="edit-field-lbl">The Action (act_desc)</label>
        <textarea class="edit-field-input" id="edit-act-desc" rows="12" placeholder="The full action description..."></textarea>
      </div>
      <div class="edit-field-group">
        <label class="edit-field-lbl">Location</label>
        <textarea class="edit-field-input" id="edit-loc" rows="2"></textarea>
      </div>
      <div class="edit-field-group">
        <label class="edit-field-lbl">Characters</label>
        <textarea class="edit-field-input" id="edit-chars" rows="2"></textarea>
      </div>
      <div class="edit-field-group">
        <label class="edit-field-lbl">Opposition</label>

      ['plotGoal','charGoal'].forEach(field => {

        if (saved !== null) roles[role][field] = saved;
      });
    });
  });
  Object.entries(GOALS.sequences).forEach(([seq, roles]) => {

})();

// ─── STATE ────────────────────────────────────────────────────
let cur = 0;
let goalsOpen = true;
let ann = JSON.parse(localStorage.getItem('grails-ann') || '{}');
function saveAnn() { localStorage.setItem('grails-ann', JSON.stringify(ann)); }
let beatEdits = JSON.parse(localStorage.getItem('grails-beat-edits') || '{}');
function saveBeatEdits() { localStorage.setItem('grails-beat-edits', JSON.stringify(beatEdits)); }
function getBeatField(beatN, field, fallback) {
  return (beatEdits[beatN] && beatEdits[beatN][field] !== undefined) ? beatEdits[beatN][field] : fallback;
}
function setBeatField(beatN, field, val) {
  if (!beatEdits[beatN]) beatEdits[beatN] = {};
  beatEdits[beatN][field] = val;
  saveBeatEdits();
}
function editableField(beatN, field, val, cls) {
  const display = h(val);
  return `<span class="beat-edit${cls?' '+cls:''}" contenteditable="true" data-beatn="${beatN}" data-field="${field}" onblur="onBeatFieldBlur(this)" onfocus="onBeatFieldFocus(this)" title="Click to edit">${display}</span>`;
}
function onBeatFieldFocus(el) {
  el.classList.add('editing');
}
function onBeatFieldBlur(el) {
  el.classList.remove('editing');
  const beatN = +el.dataset.beatn;
  const field = el.dataset.field;
  const val = el.innerText;
  setBeatField(beatN, field, val);
}
window.resetBeatEdits = function(beatN) {
  delete beatEdits[beatN];
  saveBeatEdits();
  renderBeat(cur);
  showToast('Beat fields reset to original');
};

// Get fountain filename for a beat number — uses id from loaded BEATS array
function getBeatFile(beatN) {
  const b = BEATS.find(b => b.n === beatN);
  if (b && b.id) return b.id + '.fountain';
  return BEAT_FILES_LEGACY[beatN] || null;
}

window.commitBeatEdits = async function() {
  const btn = document.getElementById('commit-nav-btn');
  if (!Object.keys(beatEdits).length) { btn.textContent = 'Nothing to commit'; setTimeout(()=>{ btn.textContent = '↑ Commit'; }, 2000); return; }
  btn.disabled = true;

  const ts = new Date().toISOString().slice(0,16).replace('T',' ') + ' UTC';
  const beatNums = Object.keys(beatEdits);
  let committed = 0, errors = 0;

  for (const beatN of beatNums) {
    const filename = getBeatFile(+beatN);
    if (!filename) continue;
    const path = `GRAILS/beats/${filename}`;
    const edits = beatEdits[beatN];
    const b = BEATS.find(b => b.n === +beatN);

    // Build append block
    const fieldLabels = {loc:'Location',chars:'Characters',pg:'Plot Goal',cg:'Character Goal',act_desc:'The Action',opp:'The Opposition',stakes:'Stakes'};
    let block = `\n---\n## Card Edit — ${ts}\n\n`;
    Object.entries(edits).forEach(([field, val]) => {
      if (fieldLabels[field]) block += `**${fieldLabels[field]}:** ${val}\n`;
    });
    block += `\n---\n`;

    btn.textContent = `Committing ${committed+1}/${beatNums.length}…`;

    try {
      // Fetch current file content + sha
      const fileRes = await fetch(`/api/github/file?owner=coywolffuturist&repo=scripts&path=${encodeURIComponent(path)}&branch=main`);
      const fileData = await fileRes.json();
      const current = fileData.decoded || '';
      const sha = fileData.sha || null;
      const newContent = current + block;

      const commitRes = await fetch('/api/github/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          owner: 'coywolffuturist', repo: 'scripts', path,
          content: newContent,
          message: `Beat ${beatN} card edit — ${ts}`,
          sha, branch: 'main'
        })
      });
      const result = await commitRes.json();
      if (result.committed) committed++;
      else errors++;
    } catch(e) { errors++; }
  }

  if (errors === 0) {
    btn.textContent = `✓ ${committed} beat${committed>1?'s':''} committed`;
    // Clear local edits after successful commit
    beatEdits = {};
    saveBeatEdits();
  } else {
    btn.textContent = `${committed} ok, ${errors} errors`;
  }
  setTimeout(() => { btn.textContent = '↑ Commit'; }, 4000);
  btn.disabled = false;
};

// ─── INIT ─────────────────────────────────────────────────────

// Build NAV after BEATS are loaded — called from initUI()
let NAV = [];
let navIdx = 0;

function buildNav() {
  NAV = [];
  const actKeys2 = {'Act One':'goals:one','Act Two':'goals:two','Act Three':'goals:three'};
  ['Act One','Act Two','Act Three'].forEach(actLabel => {
    NAV.push({ type:'goals', val: actKeys2[actLabel] });
    const seqsSeen = [];
    BEATS.forEach((b,i) => {
      if (b.actLabel === actLabel && !seqsSeen.find(s=>s===b.seq)) {
        seqsSeen.push(b.seq);
        NAV.push({ type:'goals', val:`goals:seq:${b.seq}` });
        BEATS.forEach((bb,ii) => { if(bb.seq===b.seq) NAV.push({ type:'beat', val:ii }); });
      }
    });
  });
}

// Load beats from JSON, map to internal format, then init UI
async function loadBeats() {
  try {
    const res = await fetch('/api/beats');
    if (!res.ok) throw new Error('Failed to load beats: ' + res.status);
    const raw = await res.json();
    // Sort by position (should already be sorted, but be safe)
    raw.sort((a, b) => a.position - b.position);
    BEATS = raw.map(mapBeat);
  } catch(e) {
    console.error('loadBeats error:', e);
    // Fallback: use legacy data if fetch fails
    BEATS = BEATS_LEGACY;
    showToast('⚠ Using local beat data — JSON load failed');
  }
}

function buildDropdown() {
  const sel = document.getElementById('bsel');
  sel.innerHTML = '';

  const acts = ['Act One', 'Act Two', 'Act Three'];
  const actKeys = {'Act One':'goals:one','Act Two':'goals:two','Act Three':'goals:three'};

  acts.forEach(actLabel => {
    const actSep = document.createElement('option');
    actSep.value = actKeys[actLabel];
    actSep.textContent = `── ${actLabel.toUpperCase()} ─────────────────────`;
    sel.appendChild(actSep);

    const seqsSeen = [];
    BEATS.forEach((b, i) => {
      if (b.actLabel === actLabel && !seqsSeen.find(s => s.seq === b.seq)) {
        seqsSeen.push({ seq: b.seq, firstIdx: i });
      }
    });

    seqsSeen.forEach(({ seq }) => {
      const seqKey = `goals:seq:${seq}`;
      const seqGoalOpt = document.createElement('option');
      seqGoalOpt.value = seqKey;
      const seqShort = seq.replace('SEQUENCE ', 'Seq ').split(' — ')[0] + ' — ' + seq.split(' — ')[1];
      seqGoalOpt.textContent = `  ↳ ${seqShort} Goals`;
      sel.appendChild(seqGoalOpt);

      BEATS.forEach((b, i) => {
        if (b.seq === seq) {
          const o = document.createElement('option');
          o.value = i;
          o.textContent = `  ${b.n}. ${b.title}${b.comingsoon ? ' ···' : ''}`;
          sel.appendChild(o);
        }
      });
    });
  });

  const sumSep = document.createElement('option');
  sumSep.disabled = true;
  sumSep.textContent = '── Summary Goals ──────────────────';
  sel.appendChild(sumSep);
  [['goals:one','  Act One Goals'],['goals:two','  Act Two Goals'],['goals:three','  Act Three Goals'],['goals:seqs','  All Sequence Goals']].forEach(([val, label]) => {
    const o = document.createElement('option');
    o.value = val;
    o.textContent = label;
    sel.appendChild(o);
  });
}

async function initUI() {
  await loadBeats();
  buildNav();
  buildDropdown();

  // Jump to view from URL hash or query param
  const params = new URLSearchParams(window.location.search);
  const beatParam = params.get('beat');
  const hash = decodeURIComponent(window.location.hash.replace('#', ''));
  const goalKeys = ['goals:one','goals:two','goals:three','goals:seqs','goals:seq:'];
  if (hash && (goalKeys.some(k => hash.startsWith(k)))) {
    onSelChange(hash);
  } else {
    let startIdx = 0;
    if (beatParam) {
      // ?beat=N maps to the beat at position N in the sorted array (1-indexed)
      const beatPos = parseInt(beatParam, 10);
      const found = BEATS.findIndex(b => b.n === beatPos);
      if (found >= 0) startIdx = found;
    } else if (hash && !isNaN(+hash)) {
      const found = BEATS.findIndex(b => b.n === parseInt(hash, 10));
      if (found >= 0) startIdx = found;
    }
    selectBeat(startIdx);
  }
}

window.onload = initUI;

function navTo(ni) {
  if (ni < 0 || ni >= NAV.length) return;
  navIdx = ni;
  const item = NAV[ni];
  const sel = document.getElementById('bsel');
  sel.value = item.val;
  document.getElementById('btn-prev').disabled = ni === 0;
  document.getElementById('btn-next').disabled = ni === NAV.length - 1;
  if (item.type === 'goals') {
    document.getElementById('bctr').textContent = '—';
    document.getElementById('pf').style.width = `${((ni+1)/NAV.length)*100}%`;
    window.location.hash = item.val;
    renderGoalsView(item.val);
  } else {
    cur = item.val;
    renderBeat(item.val);
  }
}

function onSelChange(val) {
  // Find in NAV and navigate there
  const ni = NAV.findIndex(n => String(n.val) === String(val));
  if (ni >= 0) { navTo(ni); return; }
  // Fallback for summary goals not in NAV
  if (val.startsWith('goals:')) {
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = true;
    document.getElementById('bctr').textContent = '—';
    document.getElementById('pf').style.width = '100%';
    window.location.hash = val;
    // Sync dropdown to the correct option
    const sel = document.getElementById('bsel');
    if (sel) sel.value = val;
    renderGoalsView(val);
  }
}

function go(dir) {
  navTo(navIdx + dir);
}

function selectBeat(idx) {
  const ni = NAV.findIndex(n => n.type==='beat' && n.val===idx);
  if (ni >= 0) { navTo(ni); } else { cur = idx; renderBeat(idx); }
}

function renderGoalsView(key) {
  const bc = document.getElementById('bc');
  let html = '';

  function goalsBlock(label, scope, g) {
    return `<div class="sec">
      ${label ? `<div class="slbl">${h(label)}</div>` : ''}
      ${renderGoalRoleBlock(scope, 'protagonist', g.protagonist)}
      ${renderGoalRoleBlock(scope, 'antagonist', g.antagonist)}
      ${renderGoalRoleBlock(scope, 'modifier', g.modifier)}
    </div>`;
  }

  if (key.startsWith('goals:seq:')) {
    // Single sequence goals
    const seq = key.replace('goals:seq:', '');
    const g = GOALS.sequences[seq];
    html += `<div class="bsq" style="margin-bottom:16px;font-size:13px;font-weight:700;color:var(--tp);letter-spacing:.1em">${h(seq)}</div>`;
    if (g) html += goalsBlock('Sequence Goals', `seq:${seq}`, g);
    else html += `<div class="fv" style="color:var(--td)">No goals defined yet for this sequence.</div>`;

  } else if (key === 'goals:seqs') {
    html += `<div class="bsq" style="margin-bottom:16px;font-size:13px;font-weight:700;color:var(--tp);letter-spacing:.1em">ALL SEQUENCE GOALS</div>`;
    Object.entries(GOALS.sequences).forEach(([seq, g]) => { html += goalsBlock(seq, `seq:${seq}`, g); });

  } else {
    const actMap = {'goals:one':'Act One','goals:two':'Act Two','goals:three':'Act Three'};
    const actLabel = actMap[key];
    const g = GOALS.acts[actLabel];
    html += `<div class="bsq" style="margin-bottom:16px;font-size:15px;font-weight:700;color:var(--tp);letter-spacing:.1em">${h(actLabel).toUpperCase()} — GOALS</div>`;
    if (g) html += goalsBlock('', `act:${actLabel}`, g);
  }

  bc.innerHTML = html;
  document.getElementById('ni').value = '';
  renderSidebar(-1);
}

function h(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function loadGoal(scope, role, field, defaultVal) {
  const k = getGoalKey(scope, role, field);
  const saved = localStorage.getItem(k);
  return (saved !== null) ? saved : defaultVal;
}

function saveGoal(scope, role, field, val) {
  const k = getGoalKey(scope, role, field);
  localStorage.setItem(k, val);
}

function goalFieldHtml(scope, role, field, defaultVal) {
  const val = loadGoal(scope, role, field, defaultVal);
  const placeholder = field === 'plotGoal' ? 'Plot goal...' : 'Character goal...';
  const isEmpty = !val;
  return `<span
    class="goals-edit-field"
    contenteditable="true"
    data-scope="${h(scope)}"
    data-role="${h(role)}"
    data-field="${h(field)}"
    data-empty="${isEmpty}"
    onblur="onGoalBlur(this)"
    oninput="onGoalInput(this)"
    title="Click to edit"
  >${isEmpty ? placeholder : h(val)}</span>`;
}

function onGoalInput(el) {
  const isEmpty = !el.textContent.trim();
  el.dataset.empty = isEmpty;
}

function onGoalBlur(el) {
  const scope = el.dataset.scope;
  const role = el.dataset.role;
  const field = el.dataset.field;
  let val = el.textContent.trim();
  const placeholder = field === 'plotGoal' ? 'Plot goal...' : 'Character goal...';
  if (val === placeholder) val = '';
  saveGoal(scope, role, field, val);
  // Update GOALS in memory too
  const scopeParts = scope.split(':');
  const scopeType = scopeParts[0]; // 'act' or 'seq'
  const scopeKey = scope.slice(scopeType.length + 1);
  if (scopeType === 'act') {
    if (GOALS.acts[scopeKey]) GOALS.acts[scopeKey][role][field] = val;
  } else {
    if (GOALS.sequences[scopeKey]) GOALS.sequences[scopeKey][role][field] = val;
  }
  el.dataset.empty = !val;
  if (!val) el.textContent = placeholder;
}

function toggleGoals() {
  goalsOpen = !goalsOpen;
  const body = document.getElementById('goals-body');
  const toggle = document.getElementById('goals-toggle');
  if (body) body.style.display = goalsOpen ? 'block' : 'none';
  if (toggle) toggle.classList.toggle('open', goalsOpen);
}

function renderGoalRoleBlock(scope, role, roleData) {
  const roleNames = { protagonist: 'Zach — Protagonist', antagonist: 'Togg — Antagonist', modifier: 'JW — Modifier' };
  const roleName = roleNames[role] || (role.charAt(0).toUpperCase() + role.slice(1));
  return `<div class="goals-role-block">
    <div class="goals-role-name">${roleName}</div>
    <div style="margin-bottom:4px">
      <div class="goals-sub-label">Plot Goal</div>
      ${goalFieldHtml(scope, role, 'plotGoal', roleData.plotGoal)}
    </div>
    <div>
      <div class="goals-sub-label">Character Goal</div>
      ${goalFieldHtml(scope, role, 'charGoal', roleData.charGoal)}
    </div>
  </div>`;
}

function renderGoals(b) {
  const actGoals = GOALS.acts[b.actLabel] || null;
  const seqGoals = GOALS.sequences[b.seq] || null;
  if (!actGoals && !seqGoals) return '';
  let html = `<div class="goals-block">
    <div class="goals-hdr" onclick="toggleGoals()">
      <span class="goals-hdr-label">Goals</span>
      <span class="goals-hdr-badge">${h(b.actLabel)} · ${h(b.seq.split(' — ')[0])}</span>
      <span class="goals-hdr-toggle ${goalsOpen ? 'open' : ''}" id="goals-toggle">▾</span>
    </div>
    <div class="goals-body" id="goals-body" style="display:${goalsOpen ? 'block' : 'none'}">
      <div class="goals-draft">Draft goals — click any field to edit</div>`;
  if (actGoals) {
    const actScope = `act:${b.actLabel}`;
    html += `<div class="goals-sect">
      <div class="goals-sect-lbl">${h(b.actLabel)}</div>
      ${renderGoalRoleBlock(actScope, 'protagonist', actGoals.protagonist)}
      ${renderGoalRoleBlock(actScope, 'antagonist', actGoals.antagonist)}
      ${renderGoalRoleBlock(actScope, 'modifier', actGoals.modifier)}
    </div>`;
  }
  if (seqGoals) {
    const seqScope = `seq:${b.seq}`;
    html += `<div class="goals-sect">
      <div class="goals-sect-lbl">${h(b.seq)}</div>
      ${renderGoalRoleBlock(seqScope, 'protagonist', seqGoals.protagonist)}
      ${renderGoalRoleBlock(seqScope, 'antagonist', seqGoals.antagonist)}
      ${renderGoalRoleBlock(seqScope, 'modifier', seqGoals.modifier)}
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

  const beatAnns = ann[idx] || [];

      ${h(a.text.slice(0,80))}${a.text.length>80?'…':''}
      <button class="cdel" onclick="deleteAnn(${idx},'${a.id}')">✕</button>

function updateCct() {
  const v = document.getElementById('ni').value;
  document.getElementById('cct').textContent = `${v.length} chars`;
}

async function sendNote() {
  const text = document.getElementById('ni').value.trim();
  if (!text) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Writing…';

  const b = BEATS[cur];
  try {
    const res = await fetch('/api/grails-edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        note: text,
        beat: {
          n: b.n, title: b.title,
          loc: getBeatField(b.n,'loc',b.loc),
          chars: getBeatField(b.n,'chars',b.chars),
          pg: getBeatField(b.n,'pg',b.pg),
          cg: getBeatField(b.n,'cg',b.cg),
          act_desc: getBeatField(b.n,'act_desc',b.act_desc),
          opp: getBeatField(b.n,'opp',b.opp),
          stakes: getBeatField(b.n,'stakes',b.stakes)
        }
      })
    });
    const { edits, error } = await res.json();
    if (error) throw new Error(error);

    if (edits && Object.keys(edits).length > 0) {
      // Apply each edit to localStorage + live DOM
      Object.entries(edits).forEach(([field, val]) => {
        setBeatField(b.n, field, val);
        // Update the live contenteditable span directly
        const el = document.querySelector(`.beat-edit[data-beatn="${b.n}"][data-field="${field}"]`);
        if (el) { el.innerText = val; el.dataset.empty = !val; }
      });
      // Flash and scroll to the first changed field
      let firstChanged = null;
      Object.keys(edits).forEach(field => {
        const el = document.querySelector(`.beat-edit[data-beatn="${b.n}"][data-field="${field}"]`);
        if (el) {
          el.style.background = 'rgba(139,92,246,0.18)';
          setTimeout(() => { el.style.background = ''; }, 1800);
          if (!firstChanged) firstChanged = el;
        }
      });
      if (firstChanged) firstChanged.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      // No structured edits returned — fall back to annotation
      if (!ann[cur]) ann[cur] = [];
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2,5);
      const now = new Date();
      const ts = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) + ' · ' + now.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      ann[cur].push({text, ts, id});
      saveAnn();
      renderBeat(cur);
    }
  } catch(e) {
    console.error('sendNote error:', e);
  }

  document.getElementById('ni').value = '';
  document.getElementById('cct').textContent = '0 chars';
  btn.disabled = false;
  btn.textContent = 'Send to Coywolf →';
}

function deleteAnn(idx, id) {
  if (!ann[idx]) return;
  ann[idx] = ann[idx].filter(a => a.id !== id);
  if (ann[idx].length === 0) delete ann[idx];
  saveAnn();
  renderBeat(idx);
}

function clearAll() {
  // Clear edits scoped to the current beat/act/sequence view only
  if (typeof cur === 'number') {
    // Beat view — clear annotations + beat field edits for this beat
    const b = BEATS[cur];
    if (ann[cur] && ann[cur].length) {
      delete ann[cur];
      saveAnn();
    }
    if (b) {
      delete beatEdits[b.n];
      saveBeatEdits();
      // Also clear goal edits for this beat's act + sequence
      const actScope = `act:${b.actLabel}`;
      const seqScope = `seq:${b.seq}`;
      ['protagonist','antagonist','modifier'].forEach(role => {
        ['plotGoal','charGoal'].forEach(field => {
          localStorage.removeItem(getGoalKey(actScope, role, field));
          localStorage.removeItem(getGoalKey(seqScope, role, field));
        });
      });
      // Reset in-memory GOALS back to originals (reload page values)
      // Simplest: reload saved goals from scratch by re-running the loader
      loadGoalsFromStorage();
    }
    renderBeat(cur);
  } else if (typeof cur === 'string' && cur.startsWith('goals:')) {
    // Goals view — clear goal edits for this scope
    const scope = cur.replace(/^goals:/, ''); // e.g. "act:Act One" or "seq:SEQUENCE 1..."
    ['protagonist','antagonist','modifier'].forEach(role => {
      ['plotGoal','charGoal'].forEach(field => {
        localStorage.removeItem(getGoalKey(scope, role, field));
      });
    });
    loadGoalsFromStorage();
    renderGoalsView(cur.replace(/^goals:/, ''));
  }
  showToast('Edits cleared for this beat');
}

function loadGoalsFromStorage() {
  // Re-apply any saved goal edits from localStorage into the GOALS object
  Object.entries(GOALS.acts).forEach(([actLabel, roles]) => {
    const scope = `act:${actLabel}`;
    ['protagonist','antagonist','modifier'].forEach(role => {
      ['plotGoal','charGoal'].forEach(field => {
        const saved = localStorage.getItem(getGoalKey(scope, role, field));
        if (saved !== null) roles[role][field] = saved;
      });
    });
  });
  Object.entries(GOALS.sequences).forEach(([seq, roles]) => {
    const scope = `seq:${seq}`;
    ['protagonist','antagonist','modifier'].forEach(role => {
      ['plotGoal','charGoal'].forEach(field => {
        const saved = localStorage.getItem(getGoalKey(scope, role, field));
        if (saved !== null) roles[role][field] = saved;
      });
    });
  });
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid #2a2a42;color:#7878a0;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 18px;border-radius:3px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._hide);
  t._hide = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

function openExport() {
  let out = `GRAILS — ANNOTATED BEAT SHEET\nExported: ${new Date().toLocaleString()}\n${'═'.repeat(60)}\n\n`;
  BEATS.forEach((b, i) => {
    out += `[BEAT ${b.n} — ${b.title}]\n${b.seq} · ${b.actLabel}\n`;
    if (b.comingsoon) { out += `STATUS: Coming soon\n`; }
    else {
      out += `CONNECTOR: ${b.con}\nLOCATION: ${b.loc}\nCHARACTERS: ${b.chars}\nPLOT GOAL: ${b.pg}\nCHARACTER GOAL: ${b.cg}\n\nTHE ACTION:\n${b.act_desc}\n\nTHE OPPOSITION: ${b.opp}\n\nSTAKES UPDATE: ${b.stakes}\nENTERTAINMENT: ${b.ent.join(', ')}\nSTRUCTURE:\n  Beginning: ${b.str.b}\n  Middle: ${b.str.m}\n  End: ${b.str.e}\n`;
    }
    const beatAnns = ann[i] || [];
    if (beatAnns.length > 0) {
      out += `\n── OPERATOR'S NOTES ──\n`;
      beatAnns.forEach(a => { out += `[${a.ts}] B: ${a.text}\n`; });
    }
    out += `\n${'─'.repeat(60)}\n\n`;
  });
  document.getElementById('mta').value = out;
  document.getElementById('mov').classList.add('open');
}

function closeEx() { document.getElementById('mov').classList.remove('open'); }

// ── EDIT BEAT MODAL ──────────────────────────────────────────────────────────
let _editBeatId = null; // the id slug of the beat being edited

function openEditBeat(beatIdx) {
  const b = BEATS[beatIdx];
  if (!b || b.comingsoon) return;
  _editBeatId = b.id;
  document.getElementById('edit-modal-ttl').textContent = `Edit Beat ${b.n} — ${b.title}`;
  document.getElementById('edit-act-desc').value = getBeatField(b.n, 'act_desc', b.act_desc);
  document.getElementById('edit-loc').value = getBeatField(b.n, 'loc', b.loc);
  document.getElementById('edit-chars').value = getBeatField(b.n, 'chars', b.chars);
  document.getElementById('edit-opp').value = getBeatField(b.n, 'opp', b.opp);
  document.getElementById('edit-stakes').value = getBeatField(b.n, 'stakes', b.stakes);
  document.getElementById('edit-save-status').textContent = '';
  document.getElementById('edit-save-btn').disabled = false;
  document.getElementById('edit-modal-overlay').classList.add('open');
}

function closeEditBeat() {
  document.getElementById('edit-modal-overlay').classList.remove('open');
  _editBeatId = null;
}

function closeEditBeatBg(e) {
  if (e.target === document.getElementById('edit-modal-overlay')) closeEditBeat();
}

async function saveEditBeat() {
  if (!_editBeatId) return;
  const btn = document.getElementById('edit-save-btn');
  const status = document.getElementById('edit-save-status');
  btn.disabled = true;
  status.textContent = 'Saving…';

  const updates = {
    act_desc: document.getElementById('edit-act-desc').value,
    loc: document.getElementById('edit-loc').value,
    chars: document.getElementById('edit-chars').value,
    opposition: document.getElementById('edit-opp').value,
    stakes: document.getElementById('edit-stakes').value
  };

  try {
    const res = await fetch(`/api/beats/${_editBeatId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates)
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Save failed');

    // Update the in-memory BEATS array
    const b = BEATS.find(b => b.id === _editBeatId);
    if (b) {
      b.act_desc = updates.act_desc;
      b.loc = updates.loc;
      b.chars = updates.chars;
      b.opp = updates.opposition;
      b.stakes = updates.stakes;
    }

    status.textContent = '✓ Saved to JSON';
    setTimeout(() => { closeEditBeat(); renderBeat(cur); }, 900);
  } catch(e) {
    status.textContent = '✗ Error: ' + e.message;
    btn.disabled = false;
  }
}

// ── RESIZE HANDLES ──────────────────────────────────────────────────────────
(function initResize() {
  const ws   = document.querySelector('.ws');
  const pl   = document.querySelector('.pl');
  const rhV  = document.getElementById('rh-v');
  const rhH  = document.getElementById('rh-h');

  // Restore saved sizes — clear any stale % values, use px only
  const savedColW = localStorage.getItem('grails:colWidth');
  if (savedColW && savedColW.endsWith('px')) pl.style.width = savedColW;

  // ── Vertical handle (left/right column split) ──
  let vDragging = false, vStartX = 0, vStartW = 0;

  rhV.addEventListener('mousedown', e => {
    vDragging = true;
    vStartX = e.clientX;
    vStartW = pl.getBoundingClientRect().width;
    rhV.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!vDragging) return;
    const dx = e.clientX - vStartX;
    const wsW = ws.getBoundingClientRect().width;
    const newW = Math.max(80, Math.min(wsW - 80, vStartW + dx));
    pl.style.width = newW + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!vDragging) return;
    vDragging = false;
    rhV.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    localStorage.setItem('grails:colWidth', pl.style.width);
  });

  // ── Horizontal handle (notes top / archive bottom) ──
  // The left panel stacks: [ph header] [iw notes] [sa send btn] [rh-h] [asb archive]
  // We resize by adjusting iw flex-basis and asb height

  const iw  = pl.querySelector('.iw');
  const sa  = pl.querySelector('.sa');
  const asb = document.getElementById('asb');

  // Show horizontal handle only when archive section is visible
  function updateHHandleVisibility() {
    const asbVisible = asb.style.display !== 'none' && asb.style.display !== '';
    rhH.style.display = asbVisible ? 'block' : 'none';
  }

  // Observe asb display changes
  const obs = new MutationObserver(updateHHandleVisibility);
  obs.observe(asb, { attributes: true, attributeFilter: ['style'] });

  // Restore saved archive height
  const savedAsbH = localStorage.getItem('grails:archiveHeight');
  if (savedAsbH) {
    asb.style.height = savedAsbH;
    asb.style.maxHeight = savedAsbH;
  }

  let hDragging = false, hStartY = 0, hStartAsbH = 0;

  rhH.addEventListener('mousedown', e => {
    hDragging = true;
    hStartY = e.clientY;
    hStartAsbH = asb.getBoundingClientRect().height;
    rhH.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!hDragging) return;
    const dy = hStartY - e.clientY; // dragging up = bigger archive
    const plH = pl.getBoundingClientRect().height;
    const saH = sa.getBoundingClientRect().height;
    const phH = pl.querySelector('.ph').getBoundingClientRect().height;
    const newAsbH = Math.max(40, Math.min(plH - phH - saH - 60, hStartAsbH + dy));
    asb.style.height = newAsbH + 'px';
    asb.style.maxHeight = newAsbH + 'px';
    iw.style.flex = '1';
  });

  document.addEventListener('mouseup', () => {
    if (!hDragging) return;
    hDragging = false;
    rhH.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    localStorage.setItem('grails:archiveHeight', asb.style.height);
  });
})();
</script>

<script>
window.toggleNotesModal = function() {
  const modal = document.getElementById('notes-modal');
  const body = document.getElementById('notes-modal-body');
  if (modal.style.display !== 'none') { modal.style.display = 'none'; return; }
  // Pull content from the hidden asb archive
  const chips = document.getElementById('achips');
  if (!chips || !chips.innerHTML.trim()) {
    body.innerHTML = '<span style="color:#6e6e8a;font-family:\'IBM Plex Mono\',monospace;font-size:10px">No Coywolf notes for this beat yet.</span>';
  } else {
    body.innerHTML = chips.innerHTML;
  }
  modal.style.display = 'block';
};

// Show/hide the "△ Notes" button based on whether there are archive items
const _origLoadAnns = window.loadAnnotations;
function patchSeeNotesBtn() {
  const chips = document.getElementById('achips');
  const btn = document.getElementById('see-notes-btn');
  if (!btn) return;
  btn.style.display = (chips && chips.children.length > 0) ? 'inline-flex' : 'none';
}
// Observe achips for changes
const _chipsObs = new MutationObserver(patchSeeNotesBtn);
document.addEventListener('DOMContentLoaded', () => {
  const chips = document.getElementById('achips');
  if (chips) _chipsObs.observe(chips, { childList: true, subtree: true });
  patchSeeNotesBtn();
});
</script>
